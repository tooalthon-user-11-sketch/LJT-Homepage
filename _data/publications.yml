- title: "On the Perception Bottleneck of VLMs for Chart Understanding"
  venue: "Arxiv"
  date: 2025-05-01
  url: "https://arxiv.org/abs/"
  category: conferences
  publication_type: "0"
  authors: "Junteng Liu, Weihao Zeng, Xiwen Zhang, Yijun Wang, Zifei Shan, Junxian He"
  featured: true
  abstract: "We investigate the perception bottleneck in Vision-Language Models when processing chart images. Our findings reveal that VLMs struggle with key perception aspects needed for accurate chart understanding, including fine-grained details and spatial relationships."
  code: "https://github.com/Vicent0205/Vision4Chart"
  featured_image: ""
  location: ""

- title: "On the Universal Truthfulness Hyperplane Inside LLMs"
  venue: "EMNLP 2024"
  date: 2024-11-30
  url: "https://arxiv.org/abs/"
  category: conferences
  publication_type: "0"
  authors: "Junteng Liu, Shiqi Chen, Yu Cheng, Junxian He"
  featured: true
  abstract: "We introduce the concept of a universal truthfulness hyperplane inside large language models. This hyperplane represents the decision boundary between truthful and hallucinated responses, and we show that it can be consistently identified across different tasks and models."
  code: "https://github.com/Vicent0205/Universal_Truthfulness_Hyperplane"
  featured_image: ""
  location: ""

